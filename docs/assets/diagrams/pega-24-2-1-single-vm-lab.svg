<rect x="528" y="82" width="556" height="351" rx="15" fill="#eaf5f4" stroke="#32817c" stroke-width="2.5"/>
<text x="553" y="114" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1b5b56">Google Cloud Ubuntu VM</text>
<text x="553" y="138" font-family="Arial,sans-serif" font-size="14" fill="#3e6865">4 vCPU · 16 GB RAM · single-node development environment</text>
<rect x="593" y="161" width="414" height="89" rx="11" fill="#fff" stroke="#2874a6" stroke-width="2"/>
<text x="800" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173b58">Tomcat 9 + Pega 24.2.1</text>
