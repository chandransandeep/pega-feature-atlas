<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 475" role="img" aria-labelledby="title desc">
<title id="title">Single VM Pega 24.2.1 development lab architecture</title>
<desc id="desc">Windows Edge communicates via a local SSH tunnel to Tomcat hosting Pega 24.2.1 on a Google Cloud Ubuntu VM. Tomcat connects to PostgreSQL 16 and Apache Kafka 3.8.1 on the same VM via localhost.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2874a6"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="475" rx="14" fill="#f7fafc"/>
<text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16354a">Pega Platform 24.2.1 — verified single-VM development lab</text>
<rect x="34" y="153" width="212" height="112" rx="12" fill="#fff" stroke="#37658a" stroke-width="2"/>
<text x="140" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173b58">Windows Edge</text>
<text x="140" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#39556a">localhost:8080</text>
<rect x="302" y="164" width="189" height="90" rx="12" fill="#e6eff7" stroke="#37658a" stroke-width="2"/>
<text x="396" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173b58">SSH local tunnel</text>
<text x="396" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#39556a">Port forwarding</text>
