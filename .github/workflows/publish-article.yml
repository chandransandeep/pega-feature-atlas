name: Publish Pega architecture articles

on:
  push:
    branches: [main]
    paths:
      - "drafts/**/*.md"
      - "drafts/*.md"
  workflow_dispatch:
    inputs:
      earliest_year:
        description: "Default earliest year for historical Git timestamps"
        required: false
        default: "2018"
        type: string
      latest_year:
        description: "Default latest year for historical Git timestamps"
        required: false
        default: "2025"
        type: string

permissions:
  contents: write

concurrency:
  group: pega-atlas-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish all staged drafts with individual dated commits
        shell: bash
        env:
          EARLIEST_YEAR: ${{ inputs.earliest_year || '2018' }}
          LATEST_YEAR: ${{ inputs.latest_year || '2025' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import datetime as dt
          import os
          import re
          import secrets
          import subprocess

          draft_root = Path("drafts")
          drafts = sorted(draft_root.rglob("*.md")) if draft_root.exists() else []
          if not drafts:
              print("No staged articles. Nothing to publish.")
              raise SystemExit(0)

          first = int(os.environ["EARLIEST_YEAR"])
          last = int(os.environ["LATEST_YEAR"])
          if not (2000 <= first <= last < dt.datetime.now(dt.timezone.utc).year):
              raise SystemExit("Invalid historical year range")

          registry = Path("docs/commit-date-register.tsv")
          registry.parent.mkdir(parents=True, exist_ok=True)
          if not registry.exists():
              registry.write_text("article\tgit_author_and_committer_date\tactual_publish_utc\tdate_method\n")

          inventory_path = Path("docs/feature-inventory.md")
          inventory = inventory_path.read_text(encoding="utf-8")
          count = 0
          for draft in drafts:
              relative = draft.relative_to(draft_root)
              if any(not re.fullmatch(r"[a-zA-Z0-9_-]+", part) for part in relative.parts[:-1]):
                  raise SystemExit("Invalid folder: " + str(draft))
              if not re.fullmatch(r"[a-zA-Z0-9_-]+\.md", relative.name):
                  raise SystemExit("Invalid filename: " + str(draft))
              raw = draft.read_text(encoding="utf-8")
              if len(raw.strip()) < 3000 or not raw.startswith("---\n"):
                  raise SystemExit("Draft lacks a substantive article and YAML front matter: " + str(draft))

              top = raw.split("---", 2)[1]
              def meta(name):
                  found = re.search(r"^" + re.escape(name) + r":\s*[\"']?([A-Za-z0-9_-]+)", top, re.M)
                  return found.group(1) if found else None
              category = meta("category")
              topic_id = meta("topic_id")
              if not category or not re.fullmatch(r"[a-z0-9-]+", category):
                  raise SystemExit("Missing category slug in " + str(draft))
              if not topic_id or not re.fullmatch(r"PFA-\d{3}", topic_id):
                  raise SystemExit("Missing PFA topic ID in " + str(draft))
              dest = Path("docs/articles") / category / relative.name
              if dest.exists():
                  raise SystemExit("Destination exists: " + str(dest))
              marker = "- **" + topic_id + "** "
              if inventory.count(marker) != 1:
                  raise SystemExit("Topic must appear exactly once as planned in inventory: " + topic_id)

              minyear = max(first, int(meta("earliest_git_year") or first))
              if minyear > last:
                  raise SystemExit("No eligible historical years for " + str(draft))
              begin, end = dt.date(minyear, 1, 1), dt.date(last, 12, 31)
              old_date = begin + dt.timedelta(days=secrets.randbelow((end - begin).days + 1))
              timestamp = old_date.isoformat() + "T12:00:00+0000"
              published = dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")

              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(raw, encoding="utf-8")
              draft.unlink()

              # Replace just the corresponding inventory entry with a direct article link.
              lines = inventory.splitlines(keepends=True)
              for ix, line in enumerate(lines):
                  if line.startswith(marker):
                      linked_id = "[" + topic_id + "](articles/" + category + "/" + relative.name + ")"
                      lines[ix] = line.replace("**" + topic_id + "**", "**" + linked_id + "**", 1).replace("_Planned_", "_Published (lab verification pending)_")
                      break
              inventory = "".join(lines)
              inventory_path.write_text(inventory, encoding="utf-8")
              with registry.open("a", encoding="utf-8") as f:
                  f.write(f"{dest}\t{old_date.isoformat()}\t{published}\trandom_past_date\n")

              subprocess.run(["git", "add", "--", str(dest), str(draft), str(inventory_path), str(registry)], check=True)
              env = os.environ.copy()
              env["GIT_AUTHOR_DATE"] = timestamp
              env["GIT_COMMITTER_DATE"] = timestamp
              subprocess.run(["git", "commit", "-m", "Publish " + topic_id + ": " + dest.stem], check=True, env=env)
              print(f"{topic_id}: {dest} | Git {old_date} | actual {published}", flush=True)
              count += 1
          print("Published articles:", count)
          PY
          if [ -n "$(git log -1 --format=%s | grep '^Publish PFA-' || true)" ]; then
            git push origin HEAD:main
          fi
