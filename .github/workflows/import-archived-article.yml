name: Import a previously published article

on:
  workflow_dispatch:
    inputs:
      draft_path:
        description: "Source Markdown file in drafts/, for example drafts/2023-data-pages.md"
        required: true
        type: string
      original_date:
        description: "Original publication date (YYYY-MM-DD)"
        required: true
        type: string
      original_url:
        description: "Evidence: URL where the article was originally published"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: archived-article-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and import
        shell: bash
        env:
          DRAFT_PATH: ${{ inputs.draft_path }}
          ORIGINAL_DATE: ${{ inputs.original_date }}
          ORIGINAL_URL: ${{ inputs.original_url }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          draft = Path(os.environ["DRAFT_PATH"])
          date_text = os.environ["ORIGINAL_DATE"]
          source = os.environ["ORIGINAL_URL"].strip()
          today = datetime.date.today()
          try:
              original_date = datetime.date.fromisoformat(date_text)
          except ValueError as exc:
              raise SystemExit("original_date must be a valid YYYY-MM-DD date") from exc
          if original_date > today:
              raise SystemExit("The original date cannot be in the future.")
          if draft.is_absolute() or ".." in draft.parts or len(draft.parts) != 2 or draft.parts[0] != "drafts" or draft.suffix != ".md":
              raise SystemExit("draft_path must be a simple drafts/*.md path")
          if not draft.is_file():
              raise SystemExit(f"Missing draft: {draft}")
          parsed = urlparse(source)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("original_url must be a real HTTPS publication URL")
          target = Path("docs/articles") / draft.name
          if target.exists():
              raise SystemExit(f"Target exists: {target}")
          raw = draft.read_text(encoding="utf-8")
          if not raw.strip():
              raise SystemExit("The draft is empty")
          target.parent.mkdir(parents=True, exist_ok=True)
          audit = (
              f"\n---\n\n"
              f"**Original publication:** {original_date.isoformat()}  \n"
              f"**Original source:** {source}  \n"
              f"**Imported into this repository:** {today.isoformat()}\n"
          )
          target.write_text(raw.rstrip() + audit, encoding="utf-8")
          draft.unlink()
          with Path("docs/import-history.tsv").open("a", encoding="utf-8") as log:
              log.write(f"{target}\t{date_text}\t{today.isoformat()}\t{source}\n")
          PY

      - name: Commit with the documented original date
        shell: bash
        env:
          DRAFT_PATH: ${{ inputs.draft_path }}
          ORIGINAL_DATE: ${{ inputs.original_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "docs/articles" "docs/import-history.tsv" "drafts"
          GIT_AUTHOR_DATE="${ORIGINAL_DATE}T12:00:00+00:00" \
          GIT_COMMITTER_DATE="${ORIGINAL_DATE}T12:00:00+00:00" \
          git commit -m "Import original article from ${ORIGINAL_DATE}: ${DRAFT_PATH}"
          git push origin HEAD:main
