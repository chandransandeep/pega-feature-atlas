name: Prepare owner attribution for existing article commits

on:
  push:
    branches: [main]
    paths:
      - ".github/reattribution-request.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pega-article-attribution-migration
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source and back up existing main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          original="$(git rev-parse HEAD)"
          test "$original" = "$(git rev-parse origin/main)"
          echo "ORIGINAL_HEAD=$original" >> "$GITHUB_ENV"
          git branch "backup/pre-owner-attribution-20261020" "$original"
          git push origin "backup/pre-owner-attribution-20261020:refs/heads/backup/pre-owner-attribution-20261020"

      - name: Rewrite only bot-authored Pega article commit identities
        shell: bash
        run: |
          set -euo pipefail
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            if [ "$GIT_AUTHOR_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              subject="$(git log -1 --format=%s "$GIT_COMMIT")"
              case "$subject" in
                "Publish PFA-"*|"Publish architecture article:"*)
                  GIT_AUTHOR_NAME="chandransandeep"
                  GIT_AUTHOR_EMAIL="171957466+chandransandeep@users.noreply.github.com"
                  GIT_COMMITTER_NAME="chandransandeep"
                  GIT_COMMITTER_EMAIL="171957466+chandransandeep@users.noreply.github.com"
                  export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
                  ;;
              esac
            fi
          ' -- main

      - name: Verify files, historical dates and rewritten article identities
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$ORIGINAL_HEAD" HEAD)"
          python3 - <<'PY'
          import subprocess
          def log(rev):
              output = subprocess.check_output(
                  ["git", "log", rev, "--format=%s%x09%aI%x09%cI%x09%an%x09%ae%x09%cn%x09%ce"],
                  text=True
              )
              return [line.split("\t") for line in output.splitlines()]
          original = log(__import__("os").environ["ORIGINAL_HEAD"])
          updated = log("HEAD")
          if len(original) != len(updated):
              raise SystemExit("Commit count changed unexpectedly.")
          count = 0
          for old, new in zip(original, updated):
              if old[:3] != new[:3]:
                  raise SystemExit("Subject or historical commit dates changed: " + old[0])
              is_target = (
                  old[4] == "41898282+github-actions[bot]@users.noreply.github.com"
                  and (old[0].startswith("Publish PFA-") or old[0].startswith("Publish architecture article:"))
              )
              if is_target:
                  count += 1
                  expected = "171957466+chandransandeep@users.noreply.github.com"
                  if new[3] != "chandransandeep" or new[4] != expected or new[5] != "chandransandeep" or new[6] != expected:
                      raise SystemExit("Incorrect owner attribution: " + old[0])
              elif old != new:
                  raise SystemExit("Non-target commit identity unexpectedly changed: " + old[0])
          if count < 150:
              raise SystemExit(f"Expected at least 150 old bot-authored publication commits; found {count}.")
          print(f"Verified {count} reattributed publication commits.")
          print("All file trees, commit subjects, and original author/committer dates preserved.")
          PY

      - name: Push separate review branch without modifying main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/review/reattributed-article-commits-20261020
          echo "Old main: $ORIGINAL_HEAD"
          echo "Proposed new main: $(git rev-parse HEAD)"
          echo "Main has NOT been rewritten. Merge/force-update only after checking this branch."
